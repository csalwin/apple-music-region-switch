name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            artifact: amtransfer-darwin-arm64
          - target: bun-darwin-x64
            artifact: amtransfer-darwin-x64
          - target: bun-linux-x64
            artifact: amtransfer-linux-x64
          - target: bun-linux-arm64
            artifact: amtransfer-linux-arm64
          - target: bun-windows-x64
            artifact: amtransfer-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile || bun install

      - name: Compile
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: bun build amtransfer.ts --compile --target="$TARGET" --outfile="$ARTIFACT"

      - name: Smoke-test help output (Linux x64 only)
        if: matrix.target == 'bun-linux-x64'
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: ./"$ARTIFACT" --help

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
